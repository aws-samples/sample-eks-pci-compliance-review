# Reference-file tests (REF-*) — one end-to-end test per reference file so each
# file earns its place in the skill. A test passes only if the behavior the
# file governs shows up in the agent's output/trace with the skill loaded.
#
# readReferenceFile(expectedReadFiles[]) asserts the agent actually opened the
# right file via the fs_ro tool; the llm-rubric checks the file's content
# shaped the result. Per-pillar tests are live (real cluster grading); index/
# format/mapping tests are offline.

# --- references/checks.md ----------------------------------------------------
- description: 'REF-01 — checks.md index drives pillar->file map, ID ranges, 67 total, one-at-a-time reads'
  metadata:
    live: false
  vars:
    request: >
      Before grading, tell me the full check inventory for this PCI review:
      how many checks, which pillars, and the check-ID range per pillar.
    live: false
    expectedReadFiles: ['references/checks.md']
    mustContain: ['67', 'NS1', 'VUL8']
  assert:
    - type: llm-rubric
      value: >
        The response engages the EKS PCI DSS compliance review workflow rather
        than declining or routing the request elsewhere.
    - type: javascript
      value: file://assertions/graders.js:readReferenceFile
    - type: javascript
      value: file://assertions/graders.js:containsAll
    - type: llm-rubric
      value: >
        The response reflects the checks.md index: 67 total checks across 8
        pillars, correct ID ranges (NS1-NS8, PS1-PS12, SI1-SI5, NET1-NET9,
        ST1-ST6, IAM1-IAM9, LOG1-LOG10, VUL1-VUL8), and the CDE-scope concept.
        It reads pillar files one at a time rather than all at once.

