    live: true
    expectedReadFiles: ['references/pillars/namespace-isolation.md']
    expectedChecks: [NS1, NS2, NS3, NS4, NS5, NS6, NS7, NS8]
  assert:
    - type: llm-rubric
      value: >
        The response engages the EKS PCI DSS compliance review workflow rather
        than declining or routing the request elsewhere.
    - type: javascript
      value: file://assertions/graders.js:readReferenceFile
    - type: javascript
      value: file://assertions/graders.js:checkAllPresent
    - type: llm-rubric
