# --- references/report-format.md ---------------------------------------------
- description: 'REF-10 — report-format.md governs artifact structure, severity model, finding block, coverage gate'
  metadata:
    live: false
  vars:
    request: >
      Show me the exact structure you will use for the final PCI report and how
      a single FAIL finding is formatted.
    live: false
    expectedReadFiles: ['references/report-format.md']
    mustContain:
      - 'executive summary'
      - 'prioritized action plan'
      - 'scorecard'
      - 'critical'
  assert:
    - type: llm-rubric
      value: >
        The response engages the EKS PCI DSS compliance review workflow rather
        than declining or routing the request elsewhere.
    - type: javascript
      value: file://assertions/graders.js:readReferenceFile
    - type: javascript
      value: file://assertions/graders.js:containsAll
    - type: llm-rubric
      value: >
        The described structure matches report-format.md: sections 1-7
        (exec summary, disclaimer, prioritized action plan, detailed findings,
        pillar scorecards, what-was-not-assessed, PCI coverage), the four-tier
        severity model (Critical/High/Medium/Low), and a finding block with
        current-state evidence, PCI Req mapping, and remediation. It states the
        coverage gate: every selected check ID must appear in a scorecard.

# --- references/pci-dss-mapping.md -------------------------------------------
- description: 'REF-11 — pci-dss-mapping.md governs the requirement crosswalk + roll-up logic'
  metadata:
    live: false
  vars:
    request: >
      Which of my checks cover PCI DSS Requirement 10, and how do you decide if
      a requirement is Supported vs a Gap vs Not assessed?
    live: false
    expectedReadFiles: ['references/pci-dss-mapping.md']
    mustContain: ['10.2.1', 'LOG1', 'gap']
  assert:
    - type: llm-rubric
      value: >
        The response engages the EKS PCI DSS compliance review workflow rather
        than declining or routing the request elsewhere.
    - type: javascript
      value: file://assertions/graders.js:readReferenceFile
    - type: javascript
      value: file://assertions/graders.js:containsAll
    - type: llm-rubric
      value: >
        The response uses the crosswalk: it lists the check IDs covering
        Requirement 10 sub-requirements (e.g., 10.2.1 -> LOG1/LOG2/LOG4/NET7)
        and applies the roll-up rule — all covering checks PASS => Supported;
        any FAIL => Gap identified; all N/A => Not assessed. It also notes which
        PCI requirements are out of scope for this EKS infra review.
