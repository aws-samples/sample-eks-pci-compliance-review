# Selection / routing tests (SEL-*)
#
# Goal: the reviewing-pci-compliance-in-aws-eks skill is chosen for genuine
# PCI-on-EKS work, and is NOT chosen for near-miss requests that belong to a
# sibling skill or to non-EKS work. These are text-only decisions, so they run
# offline (metadata.live: false) and can use PROMPTFOO_STUB_AGENT=1.
#
# `skill-used` / `not-skill-used` compare against the skill name loaded by the
# provider. The baseline provider (no skill) should never register skill-used;
# that contrast is what proves routing is coming from the skill's triggers.
#
# `live` is carried in both metadata (for --filter-metadata) and vars (so the
# provider/prompt can reference it).

# ---- Positive: skill SHOULD be selected -------------------------------------

- description: 'SEL-01 positive — explicit PCI DSS review request on EKS'
  metadata:
    live: false
  vars:
    request: Run a PCI DSS compliance review on my EKS cluster prod-payments.
    live: false
  assert:
    - type: skill-used
      value: reviewing-pci-compliance-in-aws-eks

- description: 'SEL-02 positive — validate EKS for PCI compliance'
  metadata:
    live: false
  vars:
    request: Can you validate my EKS cluster for PCI compliance before our assessment?
    live: false
  assert:
    - type: skill-used
      value: reviewing-pci-compliance-in-aws-eks

- description: 'SEL-03 positive — CDE namespace PCI question'
  metadata:
    live: false
  vars:
    request: Check whether my CDE namespaces meet PCI DSS requirements on EKS.
    live: false
  assert:
    - type: skill-used
      value: reviewing-pci-compliance-in-aws-eks

- description: 'SEL-04 positive — pre-QSA EKS PCI audit'
  metadata:
    live: false
  vars:
    request: We have a QSA assessment next month. Do an EKS PCI audit of our cardholder cluster first.
    live: false
  assert:
    - type: skill-used
      value: reviewing-pci-compliance-in-aws-eks

- description: 'SEL-05 positive — which PCI controls are missing on EKS'
  metadata:
    live: false
  vars:
    request: Which PCI DSS controls are missing on my EKS cluster?
    live: false
  assert:
    - type: skill-used
      value: reviewing-pci-compliance-in-aws-eks

# ---- Near-miss: skill should NOT be selected --------------------------------

- description: 'SEL-06 near-miss — general EKS best-practices review (→ eks-operations-review)'
  metadata:
    live: false
  vars:
    request: Do a general EKS best-practices and operational review of my cluster across all pillars.
    live: false
  assert:
    - type: not-skill-used
      value: reviewing-pci-compliance-in-aws-eks

- description: 'SEL-07 near-miss — quick cluster health check (→ eks-healthdashboard)'
  metadata:
    live: false
  vars:
    request: Give me a quick point-in-time health check of my EKS cluster right now.
    live: false
  assert:
    - type: not-skill-used
      value: reviewing-pci-compliance-in-aws-eks

- description: 'SEL-08 near-miss — non-EKS PCI scope (RDS/EC2)'
  metadata:
    live: false
  vars:
    request: Review my RDS database and EC2 fleet for PCI DSS compliance.
    live: false
  assert:
    - type: not-skill-used
      value: reviewing-pci-compliance-in-aws-eks

- description: 'SEL-09 near-miss — mutation request must not trigger a read-only review skill'
  metadata:
    live: false
  vars:
    request: Apply a default-deny NetworkPolicy to my payments namespace to fix PCI issues.
    live: false
  assert:
    - type: not-skill-used
      value: reviewing-pci-compliance-in-aws-eks
